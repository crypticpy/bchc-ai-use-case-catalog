  primary_technical_maintainer: crypticpy
  backup_release_maintainer: pending_bchc_assignment

settings:
  repository_visibility: public
  default_branch: main
  branch_ruleset: protect-branch
  branch_ruleset_scope: all_branches
  pull_requests_required: false
  required_approvals: 0
  required_checks: []
  conversation_resolution_required: false
  force_push_blocked: true
  deletion_blocked: true
  tag_protection: false
  actions_allowed: all
  default_workflow_permissions: write
  actions_may_approve_pull_requests: true
  sha_pinning_enforced_by_repository_setting: false
  pages_source_github_actions: true
  pages_https_enforced: true
  pages_environment_protection: branch_policy_only
  custom_domain: null
  custom_domain_owner: not_applicable_until_configured
  dns_renewal_owner: not_applicable_until_configured
  discussions: false
  private_vulnerability_reporting: false
  secret_scanning: true
  push_protection: true
  open_secret_scanning_alerts: 0
  dependabot_alerts: false
  dependabot_security_updates: false
  codeql: no_analysis_found

automation:
  expected_variables:
    - CATALOG_SHOWCASE
    - SUBMISSIONS_OPEN
    - VERIFICATION_SWEEP
  repository_variables_present: []
  repository_secrets_present_not_values: []
  optional_secrets_supported:
    - CONTENT_BOT_TOKEN_optional
  token_owner: not_applicable_no_repository_secret
  token_expiry_reviewed: not_applicable_no_repository_secret

open_admin_remediations:
  - require_pull_requests_on_main
  - require_one_or_more_human_approvals
  - require_current_release_checks
  - require_conversation_resolution
  - reduce_default_workflow_permissions_and_disable_action_approval
  - add_immutable_release_tag_protection
  - enable_dependabot_alerts_and_security_updates
  - enable_private_vulnerability_reporting
  - establish_codeql_analysis_after_candidate_update
  - confirm_expected_repository_variables_or_document_defaults
  - confirm_notification_delivery_with_primary_and_backup_maintainers
  - reauthenticate_gh_cli_for_maintainable_release_operations

drills:
  template_update: { last_run: null, result: not_run }
  rollback: { last_run: null, result: not_run }
  protected_data_takedown: { last_run: null, result: not_run }
  credential_rotation: { last_run: null, result: not_run }
  backup_restore: { last_run: null, result: not_run }
