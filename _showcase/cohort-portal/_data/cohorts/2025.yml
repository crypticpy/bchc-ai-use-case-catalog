materials:
  program_guides:
    - title: "Cohort handbook 2025"
      type: "guide"
      url: "https://example.org/cohorts/2025/handbook"
  templates:
    - title: "Analysis plan template, version 1"
      type: "template"
      url: "https://example.org/cohorts/2025/analysis-plan-template"
  sessions:
    - title: "Showcase recording"
      type: "video"
      url: "https://example.org/cohorts/2025/showcase-recording"
