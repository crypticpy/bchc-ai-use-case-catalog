# The gate every pull request has to clear: generated files in sync, lint,
# formatting, unit tests (Node + Ruby), data/front-matter validation, and a
# production Jekyll build.
#
# `build-matrix` adds the half a single build cannot cover: this repository
# ships four presets and three optional modules, and CI only ever built one
# combination of them. See scripts/build_variants.mjs.
#
# Runs on pull requests and on `workflow_dispatch` for any ref — a dispatch is
# how a fork re-runs the gate on a branch (`gh workflow run validate.yml --ref
# <branch>`), so nothing here reads `github.event.pull_request`. The `status`
# job posts the result back onto the dispatched commit.
name: Validate Content

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A dispatch on a branch that already has a pull-request run would otherwise
# double the spend; the newer run wins.
concurrency:
  group: validate-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; leaving the token in .git/config would let any
          # step (or anything they shell out to) act as the workflow.
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Generated files are in sync with _data/schema.yml
        # Fails when .github/ISSUE_TEMPLATE/new-entry.yml, _config.yml or the
        # configurator defaults would change. Fix locally with `npm run generate`.
        run: node scripts/generate.mjs --check

      - name: Lint (ESLint) and formatting (Prettier)
        run: npm run lint && npm run format:check

      - name: Unit tests (Node)
        run: npm test

      - name: Unit tests (Ruby)
        run: npm run test:ruby

      - name: Validate data files, front matter and file sizes
        run: npm run validate

      # Screenshots and their AVIF/WebP siblings travel together (docs/images.md).
      # Fails only when a source image has no up-to-date derivatives: run
      # `npm run images` and commit the result.
      - name: Image derivatives are in sync
        run: node scripts/derive_images.mjs --check

      - name: Build CSS
        run: npm run build:css

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --destination _site

  build-matrix:
    name: Build every preset and module combination
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; leaving the token in .git/config would let any
          # step (or anything they shell out to) act as the workflow.
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # One runner, one bundle install, eight Jekyll builds — the builds
      # themselves are seconds each, so sharding would cost more in setup than
      # it saves. `BUILD_VARIANTS` is read by test/build/variants.test.mjs if
      # this ever does need splitting across runners.
      - name: Build every variant and check the rendered copy
        run: npm run test:build

  status:
    # `gh workflow run validate.yml --ref <branch>` produces a run with no
    # pull-request payload, so GitHub attaches no check to the branch head and
    # the pull request shows nothing. Post the result as a commit status
    # instead. `statuses: write` is scoped to this job and nothing else.
    name: Report the dispatched run on its commit
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    needs: [checks, build-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Post a commit status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const jobs = ${{ toJSON(needs) }};
            const failed = Object.entries(jobs).filter(([, job]) => job.result !== 'success');
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: failed.length === 0 ? 'success' : 'failure',
              context: 'Validate Content (dispatch)',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: (failed.length === 0
                ? 'All checks passed'
                : `Failed: ${failed.map(([name]) => name).join(', ')}`
              ).slice(0, 140),
            });
