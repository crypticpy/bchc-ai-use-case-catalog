name: Scaffold new cohort year

on:
  issues:
    types:
      - opened
      - edited
  workflow_dispatch:
    inputs:
      year:
        description: "Cohort year to scaffold (YYYY)"
        required: true
        type: string

# Set the repository variable SUBMISSIONS_OPEN to `false` to accept issues from
# members and collaborators only; leaving it unset keeps them open.
#
# The jobs below declare exactly the scopes they need; nothing is granted by default.
permissions: {}

# One run per issue (or per manually-dispatched year): editing an issue three
# times in a minute must not leave three jobs force-pushing the same branch
# at each other.
concurrency:
  group: new-year-${{ github.event.issue.number || inputs.year || github.run_id }}
  cancel-in-progress: true

jobs:
  scaffold:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.issue.state == 'open'
          && contains(github.event.issue.labels.*.name, 'content:new-year')
          && (vars.SUBMISSIONS_OPEN != 'false'
              || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # Dispatching validate.yml/quality.yml onto the generated branch.
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # create-pull-request pushes with its own `token:`, so the checkout
          # does not need to leave credentials in .git/config.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"

      - name: Read the cohort year from the issue
        if: github.event_name == 'issues'
        id: extract
        run: node scripts/extract_event_fields.mjs
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0

      - name: Resolve the year
        id: year
        continue-on-error: true
        env:
          DISPATCH_YEAR: ${{ inputs.year }}
          ISSUE_YEAR: ${{ steps.extract.outputs.cohort_year }}
        run: |
          set -euo pipefail
          year="${DISPATCH_YEAR:-$ISSUE_YEAR}"
          if ! echo "$year" | grep -Eq '^[0-9]{4}$'; then
            echo "Could not read a four-digit cohort year (got '$year')." >&2
            # A fixed sentence, not the value that was typed: this output is
            # quoted back onto the issue, and the message is the whole of what
            # the person who filled the form gets to read.
            echo "error=The **Cohort Year** field needs a four-digit year, like 2026. Edit this issue to fix it and the automation will try again." >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "value=$year" >> "$GITHUB_OUTPUT"

      - name: Scaffold cohort
        id: scaffold
        if: steps.year.outcome == 'success'
        continue-on-error: true
        run: ruby scripts/scaffold_year.rb
        env:
          COHORT_YEAR: ${{ steps.year.outputs.value }}
          COHORT_INTRO: ${{ steps.extract.outputs.intro }}

      # Both steps above are `continue-on-error`, so the issue hears about the
      # problem in plain English before the job stops. Without this the run just
      # went red and the issue sat there with nothing on it at all.
      - name: Report the failure on the issue
        if: github.event_name == 'issues' && (steps.year.outcome == 'failure' || steps.scaffold.outcome == 'failure')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STEP_ERROR: ${{ steps.year.outputs.error || steps.scaffold.outputs.error }}
        with:
          script: |
            const detail = process.env.STEP_ERROR || 'The step failed; see the workflow logs for details.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                'This cohort year could not be set up yet.',
                '',
                '> ' + detail.split('\n').join('\n> '),
                '',
                'Edit this issue to fix the problem and the automation will try again. If the message above does not tell you what to change, comment here and a maintainer will help.'
              ].join('\n')
            });
            core.setFailed(detail);

      # A dispatch has no issue to comment on, so it still has to fail loudly.
      - name: Stop when the scaffolding failed
        if: github.event_name != 'issues' && (steps.year.outcome == 'failure' || steps.scaffold.outcome == 'failure')
        run: |
          echo "The year could not be resolved or scaffolded; see the steps above." >&2
          exit 1

      - name: Create pull request
        id: cpr
        if: steps.scaffold.outputs.created == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # With CONTENT_BOT_TOKEN the pull request has a real author and the
          # normal `pull_request` triggers fire; without it the step below
          # dispatches the checks by hand.
          token: ${{ secrets.CONTENT_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          branch: cohort/${{ steps.year.outputs.value }}
          commit-message: "chore: scaffold cohort ${{ steps.year.outputs.value }}"
          title: "Scaffold cohort ${{ steps.year.outputs.value }}"
          body: |
            ${{ github.event_name == 'issues' && format('Generated from issue #{0}.', github.event.issue.number) || 'Started from the Actions tab.' }}

            Scaffolds `cohorts/${{ steps.year.outputs.value }}/` and `_data/cohorts/${{ steps.year.outputs.value }}.yml`.

            ### Maintainer checklist
            - [ ] Replace the placeholder intro on the cohort landing page
            - [ ] Replace the placeholder events with the real schedule
            - [ ] Merge to publish
          labels: content:new-year
          delete-branch: true

      # A pull request opened with GITHUB_TOKEN does not trigger `pull_request`
      # workflows; GitHub parks them behind "Approve and run". `workflow_dispatch`
      # is the documented exception, and its check runs bind to the branch head
      # SHA — the pull request's head SHA — so they appear in its Checks tab.
      # See .github/workflows/new-entry.yml for the long version.
      - name: Run the content checks on the new branch
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_TOKEN: ${{ secrets.CONTENT_BOT_TOKEN }}
          BRANCH: ${{ steps.cpr.outputs.pull-request-branch }}
        run: |
          set -euo pipefail
          if [ -n "$BOT_TOKEN" ]; then
            echo "CONTENT_BOT_TOKEN is set, so the pull request triggers its own checks." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "### Checks dispatched on \`$BRANCH\`" >> "$GITHUB_STEP_SUMMARY"
          for workflow in validate.yml quality.yml lint-workflows.yml; do
            if gh workflow run "$workflow" --ref "$BRANCH"; then
              echo "- \`$workflow\`" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- \`$workflow\` could not be dispatched; approve the parked run from the Actions tab." >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Link the pull request from the issue
        if: github.event_name == 'issues' && steps.cpr.outputs.pull-request-number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          PR_OPERATION: ${{ steps.cpr.outputs.pull-request-operation }}
          COHORT_YEAR: ${{ steps.year.outputs.value }}
        with:
          script: |
            // An edited issue updates the existing pull request; say that
            // instead of repeating the full first-time comment.
            const body = process.env.PR_OPERATION === 'updated'
              ? [
                  'Updated the pull request from your edit:',
                  '',
                  process.env.PR_URL,
                  '',
                  'The diff there now shows the new scaffold.'
                ]
              : [
                  `Cohort ${process.env.COHORT_YEAR} is now a pull request waiting for a maintainer:`,
                  '',
                  process.env.PR_URL,
                  '',
                  'It carries a placeholder landing page and three placeholder events. Nothing is published until a maintainer merges it; after that, use the **Update a cohort schedule** form to put the real events in.'
                ];
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body.join('\n')
            });

      # scaffold_year.rb never overwrites, so a year that is already set up
      # produces no files, no pull request and — until this step — no reply.
      - name: Say the year already exists
        if: github.event_name == 'issues' && steps.scaffold.outputs.created == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COHORT_YEAR: ${{ steps.year.outputs.value }}
        with:
          script: |
            const year = process.env.COHORT_YEAR;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `Cohort ${year} already exists — nothing to scaffold, so no pull request was opened.`,
                '',
                `Use the **Update a cohort schedule** form to change the events stored for ${year}, or the **Add event details** form to give one of them its own page.`
              ].join('\n')
            });

      # Everything above can still leave the issue silent if the push or the
      # pull request itself is refused — most often because "Allow GitHub
      # Actions to create and approve pull requests" was never ticked.
      - name: Say the pull request could not be opened
        if: >-
          failure() && github.event_name == 'issues'
          && steps.year.outcome != 'failure' && steps.scaffold.outcome != 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: context.issue.number,
              body: [
                'Something went wrong while turning this issue into a pull request, so no pull request was opened.',
                '',
                'The usual cause is one repository setting: a maintainer should open **Settings → Actions → General → Workflow permissions** and tick **Allow GitHub Actions to create and approve pull requests**.',
                '',
                `Once that is on, edit this issue to retry. The full run is under the [Actions tab](https://github.com/${owner}/${repo}/actions).`
              ].join('\n')
            });
