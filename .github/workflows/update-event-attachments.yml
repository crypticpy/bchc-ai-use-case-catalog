name: Update event attachments from issue

on:
  issues:
    types:
      - opened
      - edited

# Set the repository variable SUBMISSIONS_OPEN to `false` to accept issues from
# members and collaborators only; leaving it unset keeps them open.
#
# The jobs below declare exactly the scopes they need; nothing is granted by default.
permissions: {}

# One run per issue: editing an issue three times in a minute must not leave
# three jobs force-pushing the same branch at each other.
concurrency:
  group: update-event-attachments-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  update:
    # `state == 'open'` matters: editing a closed, already-handled issue would
    # otherwise force-push its branch again and try to edit a merged pull request.
    if: >-
      github.event.issue.state == 'open'
      && contains(github.event.issue.labels.*.name, 'content:event-attachments')
      && (vars.SUBMISSIONS_OPEN != 'false'
          || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # Dispatching validate.yml/quality.yml onto the generated branch.
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # create-pull-request pushes with its own `token:`, so the checkout
          # does not need to leave credentials in .git/config.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"

      - name: Select exact npm
        run: node scripts/install_exact_npm.mjs

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Extract routing fields
        id: extract
        run: node scripts/extract_event_fields.mjs
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}

      - name: List available event IDs
        if: steps.extract.outputs.event_id == '' || steps.extract.outputs.event_id == 'help'
        id: list
        run: node scripts/list_events_for_year.mjs
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}

      - name: Comment with the available event IDs
        if: steps.extract.outputs.event_id == '' || steps.extract.outputs.event_id == 'help'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LIST_YEAR: ${{ steps.list.outputs.year }}
          LIST_EVENTS: ${{ steps.list.outputs.events_md }}
        with:
          script: |
            const body = [
              `### Available events for ${process.env.LIST_YEAR}`,
              '',
              process.env.LIST_EVENTS,
              '',
              'Copy the event ID you need, then edit this issue to paste it into the **Event ID** field.',
              '',
              'Only the events marked *has a details page* can take attachments. For any other one, use the **Add event details** form first — that creates the page these materials attach to.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      # `help` (and a blank field) means "tell me the IDs", which the step above
      # just did. Running the updater anyway posted a flat "no changes were
      # made" directly under that list, which reads as a refusal.
      - name: Update event attachments
        id: update
        if: steps.extract.outputs.event_id != '' && steps.extract.outputs.event_id != 'help'
        continue-on-error: true
        run: node scripts/update_event_attachments_from_issue.mjs
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}

      - name: Report the failure on the issue
        if: steps.update.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STEP_ERROR: ${{ steps.update.outputs.error }}
        with:
          script: |
            const detail = process.env.STEP_ERROR || 'The step failed; see the workflow logs for details.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                'These attachments could not be applied yet.',
                '',
                '> ' + detail.split('\n').join('\n> '),
                '',
                'Edit this issue to fix the problem and the automation will try again. If the message above does not tell you what to change, comment here and a maintainer will help.'
              ].join('\n')
            });
            core.setFailed(detail);

      - name: Create pull request
        if: steps.update.outcome == 'success' && steps.update.outputs.changed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # With CONTENT_BOT_TOKEN the pull request has a real author and the
          # normal `pull_request` triggers fire; without it the step below
          # dispatches the checks by hand.
          token: ${{ secrets.CONTENT_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          branch: ${{ steps.update.outputs.branch }}
          commit-message: "chore: update attachments for event ${{ steps.update.outputs.slug }}"
          title: "Update attachments for event ${{ steps.update.outputs.slug }}"
          body: |
            Generated from issue #${{ github.event.issue.number }}.

            Closes #${{ github.event.issue.number }}
          labels: content:event-attachments
          delete-branch: true

      # A pull request opened with GITHUB_TOKEN does not trigger `pull_request`
      # workflows; GitHub parks them behind "Approve and run". `workflow_dispatch`
      # is the documented exception, and its check runs bind to the branch head
      # SHA — the pull request's head SHA — so they appear in its Checks tab.
      # See .github/workflows/new-entry.yml for the long version.
      - name: Run the content checks on the new branch
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_TOKEN: ${{ secrets.CONTENT_BOT_TOKEN }}
          BRANCH: ${{ steps.cpr.outputs.pull-request-branch }}
        run: |
          set -euo pipefail
          if [ -n "$BOT_TOKEN" ]; then
            echo "CONTENT_BOT_TOKEN is set, so the pull request triggers its own checks." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "### Checks dispatched on \`$BRANCH\`" >> "$GITHUB_STEP_SUMMARY"
          for workflow in validate.yml quality.yml lint-workflows.yml; do
            if gh workflow run "$workflow" --ref "$BRANCH"; then
              echo "- \`$workflow\`" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- \`$workflow\` could not be dispatched; approve the parked run from the Actions tab." >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Link the pull request from the issue
        if: steps.cpr.outputs.pull-request-number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          PR_OPERATION: ${{ steps.cpr.outputs.pull-request-operation }}
        with:
          script: |
            // An edited issue updates the existing pull request; say that
            // instead of repeating the full first-time comment.
            const body = process.env.PR_OPERATION === 'updated'
              ? [
                  'Updated the pull request from your edit:',
                  '',
                  process.env.PR_URL,
                  '',
                  'The diff there now shows the new attachments.'
                ]
              : [
                  'These attachments are now a pull request waiting for a maintainer:',
                  '',
                  process.env.PR_URL,
                  '',
                  'Nothing on the event page changes until a maintainer merges it. To correct a title or a link, edit this issue — the automation will redo the pull request.'
                ];
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body.join('\n')
            });

      # The updater exits cleanly for five different reasons; it now says which
      # one, and that sentence is what goes on the issue. "No changes were made"
      # on its own gave the submitter nothing to act on.
      - name: Comment when nothing changed
        if: steps.update.outcome == 'success' && steps.update.outputs.changed != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NO_CHANGE_REASON: ${{ steps.update.outputs.reason }}
        with:
          script: |
            const reason = process.env.NO_CHANGE_REASON;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                'Nothing was changed on the event page, so there is no pull request to review.',
                '',
                reason
                  ? '> ' + reason.split('\n').join('\n> ')
                  : '> Either the event page could not be found, or the attachments already match what was submitted.',
                '',
                'Edit this issue if you want the automation to try again.'
              ].join('\n')
            });

      # The steps above can still leave the issue silent if the pull request
      # itself is refused — most often because "Allow GitHub Actions to create
      # and approve pull requests" was never ticked.
      - name: Say the pull request could not be opened
        if: failure() && steps.update.outcome != 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: context.issue.number,
              body: [
                'Something went wrong while turning these attachments into a pull request, so no pull request was opened and the event page is unchanged.',
                '',
                'The usual cause is one repository setting: a maintainer should open **Settings → Actions → General → Workflow permissions** and tick **Allow GitHub Actions to create and approve pull requests**.',
                '',
                `Once that is on, edit this issue to retry. The full run is under the [Actions tab](https://github.com/${owner}/${repo}/actions).`
              ].join('\n')
            });
