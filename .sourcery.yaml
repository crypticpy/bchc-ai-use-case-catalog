# Sourcery review settings for this repository.
#
# Pull requests scaffolded from submission issues are catalog content
# (an entry page plus its attachments), not changes to the platform code.
# The reviewers who merge them are not coders, and an automated code
# review on those PRs is noise that makes the merge step confusing.
#
# The intake workflows label every scaffolded PR at creation time
# (content:new-entry / content:new-event), so Sourcery skips exactly
# those PRs and still reviews real code changes, including template
# update PRs.
github:
  ignore_labels:
    - sourcery-ignore
    - content:new-entry
    - content:new-event
