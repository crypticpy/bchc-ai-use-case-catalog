title: "AI Practice Cohort 2026"
events:
  - id: kickoff
    name: "Cohort kickoff"
    date: 2026-09-09
    time: "12:00–1:30 PM ET"
    location: "Zoom"
    type: "Session"
    description: "Introductions, program expectations and choosing a use case."
  - id: scoping-clinic
    name: "Scoping clinic"
    date: 2026-10-07
    time: "12:00–1:30 PM ET"
    location: "Zoom"
    type: "Session"
    description: "Teams present a one-page problem statement for feedback."
  - id: midpoint-demos
    name: "Midpoint demos"
    date: 2026-12-02
    time: "12:00–2:00 PM ET"
    location: "Zoom"
    type: "Session"
    description: "Working demos and evaluation plans."
  - id: final-showcase
    name: "Final showcase"
    date: 2027-03-03
    location: "Zoom"
    type: "Showcase"
    description: "Each team publishes its catalog entry and presents results."
materials:
  program_guides:
    - title: "Cohort handbook"
      type: "guide"
      url: "https://example.org/cohort-handbook"
    - title: "Use case scoping worksheet"
      type: "worksheet"
      url: "https://example.org/scoping-worksheet"
  templates:
    - title: "Evaluation plan template"
      type: "template"
      url: "https://example.org/eval-template"
policies:
  - "Teams work only with data they are already authorised to use. Nothing containing PHI is uploaded to this site."
  - "Each team publishes one catalog entry by the final showcase; entries can be updated afterwards."
